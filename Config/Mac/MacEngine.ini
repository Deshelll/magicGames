[/Script/Engine.RendererSettings]

; --- Global Illumination ---
; Lumen слишком тяжёлый для Mac без дискретной видеокарты
; 0 = отключить, 1 = Screen Space GI (лёгкий вариант)
r.DynamicGlobalIlluminationMethod=1

; --- Reflections ---
; Lumen Reflections заменяем на Screen Space Reflections
r.ReflectionMethod=1

; --- MegaLights ---
; Выключаем — не нужен на слабой графике
r.MegaLights=0
r.Lumen.HardwareRayTracing=0

; --- Тени ---
; Снижаем разрешение теней с 2048 до 1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.7

; --- Разрешение рендера ---
; Рендерим в 75% от нативного, потом апскейл — даёт +20-30% FPS
r.ScreenPercentage=75

; --- Лишние эффекты ---
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=1
r.BloomQuality=3

; --- Metal-специфичные оптимизации ---
; Tile-based рендеринг — особенность Apple GPU
r.MetalForceTileReduction=1
; Ограничить FPS чтобы не перегревать MacBook Air
t.MaxFPS=60
